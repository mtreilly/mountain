# Local D1 tooling only (db:init, db:import, static-data export). The beta `cf d1`
# commands have no local equivalent, and Wrangler cannot read cloudflare.config.ts.
# App config (assets, entrypoint, bindings) lives in cloudflare.config.ts.
name = "convergence-explorer"
compatibility_date = "2026-09-14"

[[d1_databases]]
binding = "DB"
database_name = "convergence-db"
database_id = "e3f335e8-087d-4612-a9f1-ef3e6cce4a3d"
